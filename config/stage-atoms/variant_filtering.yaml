id: variant_filtering
version: "1.0.0"
role: operation
description: |
  Filter raw variant calls by VQSR / hard filters / CNN-based quality scores.
  ecaax namespace per EDAM audit — operation:3225 (variant classification) is
  semantic creep for filtering.
edam_operation: "ecaax:variant_filtering"
edam_data: "data:3498"
edam_format: "format:3016"
assignee: agent
depends_on:
  - variant_calling
expected_artifacts:
  - filtered_variants.vcf
  - summary_stats.tsv
  - manifest.json
  - result.json
# Hard artifact the harness verifies before accepting completion. Naming
# result.json here attaches this atom's `validators:` ids to the emitted
# RequiredArtifact.validation_obligations (builder.rs::required_artifacts_for_stage),
# so the AF-spectrum metrics written by the measurement script are gated.
required_artifacts:
  - path: result.json
    min_size_bytes: 2
required_figures:
  - manhattan
  - qq
attributes:
  candidate_tools:
    - vqsr
    - gatk_hard_filter
    - deepvariant_cnn
    - bcftools_filter
    - lofreq_filter   # AF-expression filter (preserves low-AF heteroplasmic tail); ranked, never pinned
    - vcffilter       # generic AF/INFO-expression filter, AF-window-aware
  # Triggers the AF-spectrum measurement runbook injection in
  # scripts/agent-claude.sh (gated on attributes.measurement_script) so the
  # agent runs the byte-pinned lib/measure_af_spectrum.py verbatim.
  measurement_script: measure_af_spectrum.py
# SME-overridable output-shaping parameters. These are quality/depth/missingness
# thresholds that shape the retained call set — NOT the filtering method (that
# stays agent-selected per method neutrality).
parameters:
  - name: min_qual
    type: number
    required: false
    default: 30.0
    description: "Minimum variant QUAL to retain."
  - name: min_depth
    type: integer
    required: false
    default: 10
    description: "Minimum read depth (DP) to retain a call."
  - name: max_missing_rate
    type: number
    required: false
    default: 0.1
    description: "Maximum fraction of missing genotypes allowed per site."
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
# Explicit rich ports.
# Input is the raw VCF emitted by variant_calling; output is the same shape
# minus the variants that fail the chosen filter set. Filter labels are
# preserved in the FILTER column so the producer/consumer can still
# round-trip the rejection reason without changing the physical format.
inputs:
  - name: raw_variants
    semantic_type:
      kind: ontology_term
      iri: "data:3498"
      label: "Sequence variations"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3016"
      label: "VCF"
    privacy_class: internal
outputs:
  - name: filtered_variants
    semantic_type:
      kind: ontology_term
      iri: "data:3498"
      label: "Sequence variations"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3016"
      label: "VCF"
    privacy_class: internal
# Validator obligations run by the harness post-filtering. p-value range
# guards QUAL/score columns that get renormalized into [0,1]; coordinate
# sanity guards the surviving records. The cross-stage invariants
# (filtered <= called, sample-count consistency, no record below the
# declared filter threshold) are enforced by the goal-driven
# validation-contract-variants cross_stage_output_comparison arms.
validators:
  - p_value_in_unit_interval
  - coordinate_in_contig
  - variant_filtered_count_consistency
