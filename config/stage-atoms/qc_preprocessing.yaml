id: qc_preprocessing
version: "2.1.0"
role: operation
description: |
  Apply modality-appropriate count-matrix QC. For bulk RNA-seq, columns are
  samples: assess library size and gene detection, omit cell-only doublet
  scoring, and retain the filtered raw-count matrix as tabular text. Compute a
  mitochondrial fraction only from a versioned annotation or stable-identifier
  mapping retained in the package; do not query a live annotation service for
  this metric. Record the metric as unavailable when no retained mapping exists.
  Single-cell workflows may additionally assess per-cell mitochondrial fraction
  and doublet scores. Distinct from `raw_qc`, which operates on raw reads.
  ecaax:scrnaseq_cell_qc per the EDAM audit; EDAM operation:3218 conflates
  raw-read QC with count-matrix QC.
edam_operation: "ecaax:scrnaseq_cell_qc"
edam_data: "data:3917"
edam_format: "format:3475"
assignee: agent
depends_on:
  - quantification
plot_stage_id: quality_control
expected_artifacts:
  - qc_summary.json
  - filtered_cells_index.json
  - filtered_count_matrix.tsv
  - qc_metrics.tsv
  - summary_stats.json
  - manifest.json
  - result.json
required_figures:
  - per_sample_metric_violin
  - per_sample_metric_bar
  - qc_summary_bar
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
# Explicit rich ports.
# Cell/sample-level QC of the raw count matrix from quantification.
# Output is a filtered count matrix preserving the raw-counts statistical
# state (filtering changes shape, not values).
inputs:
  - name: count_matrix
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "raw_counts"
    # Atom-static: QC filtering drops features and samples, it does not
    # rescale values, so both sides of this stage carry raw read counts.
    units: "read counts"
    normalization_state: "raw"
    privacy_class: internal
outputs:
  - name: qc_metrics
    semantic_type:
      kind: local_extension
      namespace: "ecaax"
      id: "qc_metrics"
      proposed_parent_terms: []
      definition: "Per-sample or per-cell count-matrix quality-control metrics and filter decisions"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    privacy_class: internal
  - name: qc_summary
    semantic_type:
      kind: local_extension
      namespace: "ecaax"
      id: "qc_summary"
      proposed_parent_terms: []
      definition: "Structured quality-control summary for the observations and features retained by an analysis"
    physical_format:
      iri: "format:3464"
      label: "JSON"
    privacy_class: internal
  - name: filtered_count_matrix
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "raw_counts"
    units: "read counts"
    normalization_state: "raw"
    privacy_class: internal
observables:
  observables:
    - key: counts.n_features_retained
      quantity_kind: count
      population: features
      # A narrative may call the retained set either features or genes for this
      # modality. Enumerating both makes the declaration closed, so a count of a
      # DIFFERENT population — matrix cells, which is this total times the sample
      # count — no longer binds here.
      population_terms:
        - genes
      bound_kind: point
      host_derivable: true
    - key: counts.n_samples_retained
      quantity_kind: count
      population: samples
      bound_kind: point
      host_derivable: true
