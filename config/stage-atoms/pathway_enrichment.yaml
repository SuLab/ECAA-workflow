id: pathway_enrichment
version: "1.0.0"
role: operation
# Confirmatory result-producing stage: anchors a Required recall expectation.
confirmatory: true
description: |
  Test pre-defined gene sets (KEGG / Reactome / GO / MSigDB hallmark) against
  ranked DE results. fgsea / clusterProfiler / GSEA / enrichr selected at runtime.

  Ranking gene sets needs an entity-label ↔ accession mapping (the DE table is
  keyed by Ensembl accession; gene sets are keyed by symbol or Entrez id), so
  this stage necessarily resolves one. Write it out as
  annotation/symbol_map.tsv — tab-delimited, header `symbol` then
  `ensembl_gene_id`, one row per distinct mapping, sorted by accession — under
  this task's own output dir and NOT under intermediates/, which the deposit
  export drops. This mapping comes from the pinned genome annotation
  (org.Hs.eg.db / biomaRt) rather than from the literature join, so it is the
  INDEPENDENT source the entity-label ↔ accession consistency check needs in
  order to catch a citation attached to the wrong entity.

  Retain the exact vector supplied to the enrichment implementation as
  ranked_genes.tsv under this task's output directory. It is tab-delimited
  with the columns `rank`, `gene_label`, `source_id`, and `ranking_score`, in
  the order used by the method, with one row per unique gene label. Do not put
  it under intermediates/, because exported packages omit that directory.
  Record its data-row count as `n_genes_ranked` in result.json. When identifier
  mapping or duplicate-label resolution reduces the input, describe the
  pre-mapping input count and the final ranked count as separate populations.

  Use the exact collection labels from pathway_results.tsv in
  result.json::gene_sets_collections and pathway_summary.json::collections.
  Record a provider-specific source name such as KEGG Legacy in a separate
  source field or narrative; do not substitute that provider label for the
  table's collection label.

  Record only parameters the selected implementation actually consumed. A
  declared permutation count that is never passed to the enrichment call is
  false provenance and must be omitted. Bind every reported cutoff, gene-set
  size bound, seed, and algorithm option to the same run-time variable supplied
  to the implementation.
edam_operation: "operation:2436"
edam_data: "data:0951"
edam_format: "format:3475"
assignee: agent
depends_on:
  - differential_expression
plot_stage_id: biological_interpretation
expected_artifacts:
  - pathway_results.tsv
  - pathway_summary.json
  - ranked_genes.tsv
  # The annotation-derived entity-label ↔ accession mapping this stage resolves
  # in order to rank gene sets. Expected rather than REQUIRED: no shipped
  # library writes it here, so making it required would fail-close every
  # re-dispatch of this stage. Expected still surfaces it as a coverage gap and
  # tells the agent where to put it.
  - annotation/symbol_map.tsv
  - manifest.json
  - result.json
required_artifacts:
  - path: ranked_genes.tsv
    min_size_bytes: 1
required_figures:
  - top_enriched_terms
attributes:
  candidate_tools:
    - fgsea
    - clusterprofiler
    - gsea
    - enrichr
  candidate_databases:
    - kegg
    - reactome
    - go_bp
    - go_mf
    - go_cc
    - msigdb_hallmark
# SME-overridable output-shaping parameters. These are the significance cutoff and
# a minimum gene-set-size filter that shape which terms get reported — NOT the
# enrichment method or database (those stay agent-selected per method neutrality).
parameters:
  - name: pvalue_threshold
    type: number
    required: false
    default: 0.25
    description: "Adjusted-p-value cutoff for reporting a preranked GSEA term/pathway."
  - name: min_gene_set_size
    type: integer
    required: false
    default: 10
    description: "Ignore gene sets/pathways smaller than this many genes."
resource_profile:
  cpu: light
  memory: small
  gpu: false
  runtime_class: minutes
claim_boundary: |
  Enrichment is a statistical signal that a gene set is over-represented at
  the top / bottom of a ranked list. It does not establish that the pathway
  is biologically activated or repressed in the experimental system.
# Explicit rich ports.
# Consumes a DE-ranked gene table; emits a per-pathway enrichment
# table with NES + p-value + adjusted p-value.
inputs:
  - name: ranked_de_results
    semantic_type:
      kind: ontology_term
      iri: "data:0951"
      label: "Statistical estimate score"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "de_tested"
    # Atom-static: the ranking statistic this stage reads is the signed
    # effect size of a differential test, which the producing atoms
    # (`differential_expression`, `translation_efficiency_de`) declare on
    # their own output as the same value. A producer that declares no
    # units leaves the check honestly unknown rather than failing it.
    units: "log2 fold change"
    privacy_class: internal
  # Gene-set collection (GMT) the pathway databases above are tested
  # against (KEGG / Reactome / GO / MSigDB hallmark). OPTIONAL: the default
  # Enrichr tool fetches its gene-set libraries over the network (see the
  # `safety.network` egress allowlist below), so a locally-registered GMT is
  # not required for the atom to run — only the OFFLINE tools (fgsea /
  # clusterProfiler) consume it. Marked optional so the composer does NOT
  # prune enrichment when no local gene-set source is registered; instead the
  # stage runs over the network and offline re-execution (replay) SKIPS it as
  # not-offline-reproducible (Unavailable), exactly like the literature stages,
  # rather than pushing the network work into the shared `reporting` atom.
  # Typed `data:2600` ("Pathway or network") — the shared GENE_SET_SEMANTIC_IRI
  # the source-typing pass surfaces on the ingest anchor — so producer/consumer
  # types still unify when a GMT IS registered.
  - name: gene_set_collection
    semantic_type:
      kind: ontology_term
      iri: "data:2600"
      label: "Pathway or network"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
      extension: "gmt"
    cardinality: { kind: optional }
    privacy_class: internal
outputs:
  - name: pathway_results
    semantic_type:
      kind: ontology_term
      iri: "data:0960"
      label: "Pathway"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "multiple_testing_corrected"
    privacy_class: internal
# Declares how the report-data assembler + reporting invariants read this
# stage's primary result artifact. Real pathway_results.tsv header:
# `pathway collection pval padj log2err ES NES size leadingEdge`.
result_schema:
  artifact: pathway_results.tsv
  entity_column: pathway
  significance: { column: padj, threshold: 0.25, comparator: lt }
  signed_effect_column: NES
  grouping_column: collection
# Network egress: the default Enrichr tool fetches gene-set libraries + computes
# enrichment against the maayanlab.cloud API. Declared as egress (level: network
# + non-empty allowlist) so the replay selector's `stage_requires_egress` treats
# this stage as not-offline-reproducible and SKIPS it (Unavailable) — like the
# literature stages — instead of running it offline where the network call fails.
# `level` MUST be `network` (compute + a non-empty allowlist trips
# atom_safety::validate_atom_safety → ComputeAtomHasNetwork → hard load failure).
safety:
  level: network
  network:
    kind: none
    allowlist:
      - maayanlab.cloud
