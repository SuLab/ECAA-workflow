id: normalisation
version: "1.0.0"
role: operation
description: |
  Standardise expression values to remove library-size and composition biases.
  Method neutrality: DESeq2 VST / edgeR TMM / scran pooling / Seurat
  LogNormalize / scnorm / sctransform are selected at runtime.
edam_operation: "operation:3435"
edam_data: "data:3917"
edam_format: "format:3475"
assignee: agent
depends_on:
  - qc_preprocessing
plot_stage_id: normalization
expected_artifacts:
  - normalized_counts_index.json
  - hvg_list.tsv
  - manifest.json
  - result.json
required_figures:
  - mean_variance
  - hvg_count_bar
attributes:
  candidate_tools:
    - deseq2_vst
    - edger_tmm
    - scran
    - seurat_lognormalize
    - sctransform
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
# Explicit rich ports.
# Input is the (filtered) raw count matrix; output is the normalized
# count matrix. The concrete normalization_state value is set by the
# runtime-selected method (vst | tmm | log_normalize | sctransform);
# leaving it as the generic "normalized" tag keeps the atom method-
# neutral while still flagging "values transformed since raw" to the
# compatibility engine.
#
# `sample_metadata` is a real cross-stage read, not a modeling
# addition (RCA I-1): every count-based normalization method
# (DESeq2 VST blind=FALSE, edgeR TMM with a design, sctransform with
# a covariate) fits against the sample-level design (condition, batch,
# cell line, …), which lives in `data_acquisition`'s cohort manifest —
# not in the count matrix itself. Declaring it here (matching
# `data_acquisition.cohort_manifest`'s own type exactly) makes that
# read first-class and typed instead of an undeclared reach past this
# atom's declared input contract.
#
# Listed BEFORE `count_matrix`: the composer's archetype-seed port
# picker (`pick_best_port_pair`) tries consumer inputs in declaration
# order and returns on the first producer/consumer pair that proves
# Compatible. `data_acquisition` exposes both `cohort_manifest`
# (data:2531) and `raw_count_matrix` (data:3917) — if `count_matrix`
# were tried first it would bind to `raw_count_matrix` (an exact
# type match) and `sample_metadata` would never get wired. Trying
# `sample_metadata` first lets it claim `cohort_manifest` before
# `count_matrix` has a chance to shadow it; `qc_preprocessing` (the
# other declared producer) exposes no data:2531-shaped output, so its
# own edge still binds `count_matrix` correctly regardless of order.
inputs:
  - name: sample_metadata
    semantic_type:
      kind: ontology_term
      iri: "data:2531"
      label: "Experiment annotation"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    privacy_class: internal
  - name: count_matrix
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "raw_counts"
    # Atom-static: this port is the pre-normalization substrate by
    # definition — the stage's whole job is to change these two facets.
    units: "read counts"
    normalization_state: "raw"
    privacy_class: internal
outputs:
  - name: normalized_counts
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "normalized"
    normalization_state: "normalized"
    # `units:` is deliberately absent. The normalized scale (CPM / TPM /
    # VST / rlog) follows from the method the agent selects at runtime,
    # so no value is statically true here; declaring one would either
    # state something false or prescribe a method. It stays unknown.
    privacy_class: internal
