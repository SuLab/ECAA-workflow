id: survey_method_landscape
version: "1.0.0"
role: operation
description: |
  Retrieve a context-scoped METHOD-LANDSCAPE for this analysis: for each
  runtime method-choice axis in the workflow, gather candidate methods and
  PMID/DOI/URL-anchored evidence, conditioned on the specific data
  (organism, protocol, sample count, missingness from the upstream QC +
  sample-manifest) and the analysis goal/modality. When the task carries
  an attributes.goal_context (the SME analysis goal), treat it as RETRIEVAL
  SCOPE — gather candidate methods + evidence relevant to that goal (e.g. a
  low-allele-frequency / heteroplasmy detection goal widens retrieval toward
  AF-window-aware candidates). This conditions WHAT is retrieved only; it is
  never a ranking or recommendation instruction. Honors
  config/downstream-policy/source-discovery-policy.json. Emit a
  method_landscape.csv where every row is locator-anchored with a
  substring-verified evidence_quote. No synthesis; no ranking (the
  discover_* atoms rank deterministically from this table).
edam_operation: "operation:0305"
assignee: agent
inputs:
  - name: intake_facts
    semantic_type:
      kind: ontology_term
      iri: "topic:3678"
      label: "Experimental design and studies"
      ontology_version: "EDAM-1.25"
    physical_format: { iri: "format:3464", label: "JSON" }
    privacy_class: internal
outputs:
  - name: method_landscape
    semantic_type:
      kind: ontology_term
      iri: "ecaax:method_landscape_matrix"
      label: "Method landscape matrix"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:3752", label: "CSV" }
    privacy_class: internal
attributes:
  source_scope_env: ECAA_LIT_SOURCE_SCOPE
  retrieval_tools:
    - pubmed_eutilities_esearch
    - pubmed_eutilities_efetch_pmc_xml
    - pubmed_eutilities_efetch_abstract
expected_artifacts:
  - method_landscape.csv
  - method_landscape.json
  - evidence/manifest.json
  - result.json
required_artifacts:
  - path: method_landscape.csv
    schema_ref: schemas/method_landscape_matrix.schema.json
  - path: evidence/manifest.json
    schema_ref: schemas/literature_evidence_manifest.schema.json
validators:
  - source_resolves
  - evidence_quote_substring_match
  - redistributable_or_marked
  - claim_support_satisfied
  - doc_page_matches_tool
figure_exempt:
  reason: "Structured-text outputs only; no canonical plot affordance."
  category: non_plottable
resource_profile: { cpu: light, memory: small, gpu: false, runtime_class: minutes }
safety:
  level: network
  network:
    kind: none
    allowlist:
      - eutils.ncbi.nlm.nih.gov
      - ftp.ncbi.nlm.nih.gov
      - api.openalex.org
      - api.crossref.org
      - readthedocs.io
      - bioconductor.org
      - github.com
      - raw.githubusercontent.com
      - nf-co.re
claim_boundary: |
  Every row in method_landscape.csv is a verbatim quote from one resolvable
  source (PMID/DOI/URL), with its locator, source_class, and evidence_role.
  Do NOT rank, recommend, paraphrase, or synthesize. Ranking is the
  downstream discover_* atom's deterministic job. Rows whose evidence_quote
  does not substring-match the retrieved snapshot are emitted verified=false.
