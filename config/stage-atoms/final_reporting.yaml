id: final_reporting
version: "1.0.0"
role: operation
description: |
  Assemble the project-level final report: cross-stage narrative, dashboard
  index, key figures, methods + caveats. Final node before SME review.
edam_operation: "operation:0337"
edam_data: "data:2048"
edam_format: "format:2331"
assignee: agent
depends_on:
  - reporting
expected_artifacts:
  - final_report.md
  - dashboard_index.json
  - manifest.json
  - result.json
required_figures:
  - summary_dashboard
resource_profile:
  cpu: light
  memory: small
  gpu: false
  runtime_class: minutes
claim_boundary: |
  Findings-first: lead with the validated result rows and the
  biological_interpretation narrative (when present), then methods and
  caveats. Restate findings exactly as produced by upstream validated
  tasks — every claim traces to an emitted result row or to an
  interpretation statement that itself cites one. Do not introduce
  claims that aren't backed by an emitted artifact; do not soften or
  strengthen effect-size language; do not recommend methods the
  pipeline did not run.

  This report is the read-and-evaluated deliverable, so carry the upstream
  substance FORWARD into it rather than collapsing to a thin digest: the
  findings, their interpretation, and the data/source grounding the
  upstream tasks already recorded must appear in the report itself, not be
  left behind in per-task outputs or the trace. This is faithful
  re-emission under the trace-to-artifact rule above — NOT license to pad
  with generic prose, and NOT license to add any finding, theme, value, or
  citation that no upstream artifact produced (an unsupported addition is a
  fabrication, worse than an omission). Generic reporting discipline only;
  do not tailor content to any external grading rubric.
interpretation_exempt_from_word_budget: true
required_report_sections:
  - provenance_method_rationale
  - qc_preprocessing
  - primary_results
  - literature_contextualization
  - reproducibility
  - claim_boundary
required_tables:
  - significant_entities
  - literature_concordance
# RCA I-1 — declared read-allowance (not a port). This atom is shared
# by ~30 archetypes with wholly different upstream analytical shapes
# (DE-family, peak-calling, variant-calling, clinical, …), and its own
# job is to aggregate whatever the composed DAG actually produced (the
# claim_boundary above requires "carrying the upstream substance
# forward" and the dashboard walks every sibling stage's figures/
# manifest.json to build dashboard_index.json) — so the real read set
# is DAG-shape/archetype dependent and can't be enumerated as fixed
# input ports without a per-archetype specialization of this atom for
# every shape it's reused across. A typed port is the right fix when
# the producer is fixed and known (see `normalisation`'s new
# `sample_metadata` port for that case); this is the documented
# exception for when it genuinely isn't.
read_allowance:
  - scope: any_upstream_stage
    rationale: >-
      final_reporting aggregates the whole analysis bundle for the
      project-level dashboard and final narrative. Confirmed against a
      real bulk_rnaseq execution (RCA I-1): it reads
      differential_expression/result.json,
      pathway_enrichment/result.json, and
      contextualize_findings_with_literature/result.json directly
      (beyond its single declared `reporting` producer) to restate
      their metrics, and unconditionally walks every sibling
      runtime/outputs/<stage>/figures/manifest.json to assemble
      dashboard_index.json. Which upstream stages exist varies per
      archetype (DE-family vs peak-calling vs clinical, etc.), so this
      is declared as a broad, reviewed exception rather than modeled as
      fixed ports.
# Explicit rich ports.
# Consumes the full upstream analysis bundle; emits the final
# narrative report (HTML primary + PDF companion).
inputs:
  - name: analysis_bundle
    semantic_type:
      kind: ontology_term
      iri: "data:2048"
      label: "Report"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3464"
      label: "JSON"
    privacy_class: internal
outputs:
  - name: final_report_html
    semantic_type:
      kind: local_extension
      namespace: "ecaax"
      id: "final_report"
      proposed_parent_terms:
        - "data:2048"
      definition: "Project-level final report: cross-stage narrative, dashboard index, key figures, methods + caveats"
    physical_format:
      iri: "format:2331"
      label: "HTML"
    privacy_class: internal
  - name: final_report_pdf
    semantic_type:
      kind: ontology_term
      iri: "data:2048"
      label: "Report"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3508"
      label: "PDF"
    privacy_class: internal
