id: differential_expression
version: "1.0.0"
role: operation
# Confirmatory result-producing stage: anchors a Required recall expectation.
confirmatory: true
description: |
  Test for differentially expressed genes between conditions / cell types.
  DESeq2 / edgeR / limma-voom / MAST / Wilcoxon selected at runtime based on
  modality (bulk vs single-cell) and design.

  RECORD-WHAT-YOU-DID (audit, not instruction): in result.json, write down the
  model you actually fit so it can be audited — this does NOT tell you which
  model/test to use, only to state your own choice. Record:
    - design_formula: the model formula you fit (e.g. "~ condition + sex + RIN").
    - response_variable: the model's outcome / left-hand side (the thing being
      explained). For a contrast-based DE this is the expression/count response;
      for a regression against an outcome it is that outcome variable.
    - available_covariates: the covariate columns you observed in the sample
      metadata (your honest list of what was available, e.g.
      ["condition","sex","age","RIN"]).
    - primary_variable: the main comparison variable for the contrast (e.g.
      "condition").
    - stated_outcome: CONDITIONAL, NOT part of the standard checklist above —
      record it ONLY when the task explicitly names a target outcome to
      regress against (e.g. a named clinical/phenotypic variable). For a
      plain DE-by-condition contrast (comparing groups/cell types — the
      common case) OMIT this key entirely; do NOT copy response_variable's
      or primary_variable's own value into it just to "complete" the record.
      An unwarranted value here arms a domain-correctness check that is
      designed to stay skipped for the common case (RCA I-10).
  These are YOUR record of YOUR choices and of the data/task — a domain-correctness
  contract checks them for internal + task consistency (e.g. the design adjusts
  for an available covariate; the response matches the stated outcome). It never
  prescribes a model.

  RUNTIME-METADATA CONSISTENCY: if the executable script chooses an effect-size
  shrinkage method through an availability fallback, bind the analysis call and
  every emitted `lfc_shrinkage` field to the same run-time variable. Do not
  hard-code the preferred method in de_summary.json and then post-edit the JSON
  after a different fallback ran. The retained script must regenerate truthful,
  identical method metadata during replay.

  ESTIMATOR COHERENCE: every primary effect estimate, uncertainty, test
  statistic, raw p-value, and adjusted p-value in a results row MUST come from
  the same inferential result object. A post-hoc shrunken, regularized, or
  posterior effect is a separate estimate: retain it in separately named
  columns and never overwrite the primary effect or uncertainty columns while
  leaving the primary test statistic and p-values beside them. This rule is
  method-neutral. It applies to any engine that creates an alternate estimate,
  and it does not require an unregularized estimate when regularization is part
  of the primary joint inferential model.

  Record the contract in result.json::effect_estimator_contract. Include
  task-relative `results_artifact`, `mode` (`single_inferential` or
  `post_hoc_secondary`),
  `primary_effect_column`, and every inferential companion column that exists:
  `primary_uncertainty_column`, `test_statistic_column`, `pvalue_column`, and
  `adjusted_pvalue_column`. Put any other primary companion, such as a
  posterior probability, interval bound, or model score, in
  `primary_inferential_companion_columns`. For `post_hoc_secondary`, also include
  `secondary_effect_column`; include `secondary_uncertainty_column` only when
  the selected method emits one. Name the primary and secondary estimators in
  `primary_estimator` and `secondary_estimator`. All declared columns must
  exist in the retained table. The canonical result-schema effect column is
  the primary inferential effect, not the post-hoc estimate.

  CANONICAL COUNT HANDOFF: when a direct `qc_preprocessing` dependency emits
  `filtered_count_matrix.tsv`, a count-GLM analysis MUST read that exact
  artifact as its `raw_counts` input. Feature/sample filtering changes the
  matrix population, not its raw-count statistical state. Do not reopen a
  count matrix from `data_acquisition`, `quantification`, or another ancestor,
  and do not substitute a new prefilter. Record the exact QC artifact in
  reads.jsonl under the `raw_counts` port, and do not also record or consume the
  mutually exclusive `normalized_counts` sibling. Exactly one count substrate
  may be selected. The data-row population written to de_results.tsv must equal
  the population in the canonical QC handoff.

  COUNT-CONSISTENCY (defense-in-depth): the significant-entity count you report
  (and any `n_sig` you record) MUST come from the SAME significance vector
  written to de_results.tsv — never from a separately-thresholded object. If you
  build a shrunken-effect object (e.g. via `lfcShrink`) for the reported effect
  sizes, construct it from the SAME fitted result used for the written `padj`
  column (matching `alpha`/contrast) so its own `padj` agrees with the table you
  emit; better still, count `n_sig` by re-reading the written de_results.tsv
  rows directly rather than trusting a second in-memory object's own significance
  call. Two objects built from the same fit but different defaults (e.g. one at
  the DESeq2 default `alpha=0.1`, the other at this run's `adjusted_pvalue_threshold`)
  will silently disagree on which rows are significant — report the count that
  matches the rows you actually wrote to disk.
edam_operation: "operation:3223"
edam_data: "data:3917"
edam_format: "format:3475"
assignee: agent
# Count substrate producers for the `counts` one-of group.
# `qc_preprocessing` emits the canonical feature/sample-filtered raw count
# matrix (count-GLM tools: DESeq2/edgeR/limma-voom); `normalisation` emits
# normalized counts (rank-based tools: MAST/Wilcoxon). `data_acquisition`
# supplies sample metadata for the fitted design. The composer binds whichever
# count member's producer exists on the path, and the runtime method choice
# selects the substrate actually read. Archetypes override this per branch.
depends_on:
  - qc_preprocessing
  - normalisation
  - data_acquisition
expected_artifacts:
  - de_results.tsv
  - de_summary.json
  - manifest.json
  - result.json
required_figures:
  - volcano
  - top_features_heatmap
attributes:
  candidate_tools:
    - deseq2
    - edger
    - limma_voom
    - mast
    - wilcoxon
  # Byte-pinned containerized measurement (hoisted to spec.attributes.measurement_script
  # by the emitter, runbook injected by scripts/agent-claude.sh). The agent runs
  # lib/measure_de_effect_size.py against its OWN de_results.tsv; it recomputes a
  # method-neutral domain-correctness scalar (how many of the agent's own
  # top-by-effect features sit in the lowest-information stratum of its own
  # abundance column) into result.json, read by the
  # differential_expression.top_effect_reliability assertion in
  # validation-contract-association.json / validation-contract-singlecell.json.
  # No method/threshold is handed to the agent — same shape as the variant
  # contract's measure_af_spectrum.py.
  measurement_script: measure_de_effect_size.py
  # Record-what-you-did contract consumed by the harness method-correctness
  # validation contract (validation-contract-association.json /
  # validation-contract-singlecell.json `differential_expression` stage). These
  # are fields the agent records in result.json describing its OWN model + its
  # OWN observation of the data/task — NOT a prescription of which model/test to
  # fit. The contract checks them for internal + task consistency (design
  # adjusts for an available covariate; response matches the stated outcome).
  result_contract:
    # Unconditional checklist: record every one of these for every run. Do
    # NOT add stated_outcome here — see record_when_applicable below (RCA
    # I-10: an agent following an unconditional checklist literally will
    # always populate a field even when the atom's own prose says to omit
    # it, arming a domain-correctness gate designed to stay skipped).
    record_in_result_json:
      - design_formula
      - response_variable
      - available_covariates
      - primary_variable
    # Conditional fields: record ONLY when the stated precondition holds;
    # omit the key entirely otherwise. Kept structurally separate from
    # record_in_result_json so the checklist itself cannot be read as
    # "always fill in every field listed here".
    record_when_applicable:
      stated_outcome: >-
        ONLY when the task explicitly names a target outcome to regress
        against (e.g. a named clinical/phenotypic variable). OMIT this key
        for a plain DE-by-condition contrast — never copy
        response_variable's or primary_variable's own value into it.
    note: >-
      record-what-you-did, not be-told-what-to-do. State the model you fit and
      the covariate columns you observed; the harness checks your own record for
      domain-correctness. available_covariates is agent-recorded in v1 —
      pinning it to a measurement script is a follow-up
      (docs/known-limitations.md). stated_outcome is CONDITIONAL (see
      record_when_applicable) — recording it for a plain contrast arms a
      check designed to stay skipped for that common case. Also include a
      `gene_symbol` column alongside `gene_id` in the results table, resolved
      from the run's pinned annotation (org.Hs.eg.db / biomaRt) — never
      hardcoded. This gives the downstream gene-symbol↔Ensembl consistency
      check an INDEPENDENT annotation so a literature citation cannot be
      attached to the wrong gene.
# SME-overridable output-shaping parameters. These are significance/effect-size
# thresholds and filtering knobs that shape the reported DE call set — NOT the
# DE method/test (that stays agent-selected per method neutrality).
parameters:
  - name: adjusted_pvalue_threshold
    type: number
    required: false
    default: 0.05
    description: "FDR-adjusted p-value cutoff for calling a feature differentially expressed."
  - name: log2fc_threshold
    type: number
    required: false
    default: 0.0
    description: >-
      Optional minimum absolute log2 fold-change for a stricter reported call
      set. The neutral default applies no effect-size cutoff, so the default
      call set agrees with result_schema.significance (padj < 0.05). An SME may
      set a positive threshold explicitly.
  - name: independent_filtering
    type: boolean
    required: false
    default: true
    description: "Apply independent filtering of low-information features before multiple-testing correction."
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
claim_boundary: |
  Differential expression is statistical association, not biological causation.
  Report effect-size + adjusted p-value + the reference factor level for every
  contrast. Avoid mechanistic language; prefer "associated with" / "enriched in"
  over "drives" / "causes".
# Explicit rich ports.
# Input is a count matrix (raw or normalized — a method-neutral one-of;
# count-GLM tools like DESeq2/edgeR fit raw counts, rank-based tools
# consume normalized counts) paired with the experimental design; output
# is the DE results table with logFC + p-value + padj.
inputs:
  # Keep the design port first. The archetype lift examines consumer ports in
  # declaration order for each dependency; placing metadata first lets a
  # multi-output data_acquisition dependency bind cohort_manifest here instead
  # of claiming the raw_counts member that QC already owns.
  - name: experimental_design
    semantic_type:
      kind: ontology_term
      iri: "data:2531"
      label: "Experiment annotation"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    privacy_class: internal
  - name: raw_counts
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "raw_counts"
    # Atom-static: the raw member of the `counts` one-of is the integer
    # count substrate a count-GLM fits, so its scale is fixed by the
    # contract, not by the run.
    units: "read counts"
    normalization_state: "raw"
    cardinality: { kind: optional }
    privacy_class: internal
  - name: normalized_counts
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "normalized"
    # Atom-static: the normalized member of the one-of. `units:` stays
    # unset for the same reason as on `normalisation`'s output — the
    # normalized scale is a runtime method choice.
    normalization_state: "normalized"
    cardinality: { kind: optional }
    privacy_class: internal
input_groups:
  - name: counts
    kind: one_of
    members: [raw_counts, normalized_counts]
    min_bound: 1
outputs:
  - name: de_results
    semantic_type:
      kind: ontology_term
      iri: "data:3134"
      label: "Gene expression data"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    units: "log2 fold change"
    statistical_state: "de_tested"
    privacy_class: internal
# Declares how the report-data assembler + reporting invariants read this
# stage's primary result artifact. The real de_results.tsv header is
# `gene baseMean log2FoldChange lfcSE pvalue padj` — signed_effect_column
# names the DESeq2-native `log2FoldChange` column. Runs that emit the
# effect-size column under its ECAA-canonical alias instead (the `log2FC` /
# `logFC` names used in the non_determinism prose below) are covered by
# signed_effect_aliases: the assembler resolves signed_effect_column first,
# then each declared alias, in order. These candidate names are data-driven
# from this declaration — never a hardcoded alias set in the assembler.
# entity_column has the same dual-name fragility: the canonical row identifier
# is `gene`, but a run may emit it as `gene_id` (Ensembl), `gene_name`, or
# `symbol` — entity_column_aliases lists the accepted synonyms, resolved after
# entity_column, in order (again data-driven from this declaration).
result_schema:
  artifact: de_results.tsv
  entity_column: gene
  entity_column_aliases: [gene_id, gene_name, symbol]
  significance: { column: padj, threshold: 0.05, comparator: lt }
  signed_effect_column: log2FoldChange
  signed_effect_aliases: [log2FC, logFC]
# Declared non-determinism (Rec 1). Separately named shrunken effect-size
# columns are outputs of an empirical-Bayes adaptive-shrinkage
# step (e.g. DESeq2/apeglm or ashr) whose fitted prior shifts both estimates
# within the tolerance band across runs, and which is itself environment-sensitive
# (the recorded shrinkage engine may be absent from a re-execution's env, so the
# effect-size columns fall back to a different estimator). The Wald stat/pvalue/padj
# come from the UNSHRUNKEN model, so the significant set is shrinkage-independent.
# The primary inferential effect and uncertainty are intentionally excluded:
# they must remain coupled to the retained statistic and p-values. Cover the
# accepted secondary spellings so replay does not treat the same
# adaptive-shrinkage output differently solely because an executor chose a
# valid header alias.
# Projected at emit time into determinism-shim.json::non_deterministic_artifacts
# so a divergence confined to these two columns is bucketed
# AcknowledgedNonDeterminism, while a divergence in any other column (e.g. stat,
# pvalue, padj) or beyond the band still Fails.
non_determinism:
  - artifact: de_results.tsv
    columns:
      - log2FoldChange_shrunken
      - log2FC_shrunken
      - logFC_shrunken
      - lfcSE_shrunken
    kind: adaptive_shrinkage
    reason: >-
      Empirical-Bayes adaptive shrinkage of effect sizes (e.g. DESeq2/apeglm or
      ashr) fits a prior from the data whose shrinkage of the log2FC and
      lfcSE columns is not bit-reproducible across BLAS threadings, and whose
      chosen engine may differ between the recorded run and a re-execution; the
      shrunken values may vary within the semantic band without indicating error.
      The unshrunken Wald stat/pvalue/padj (and thus the significant set) are
      unaffected.
