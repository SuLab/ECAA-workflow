id: data_acquisition
version: "1.0.0"
role: operation
description: |
  Acquire raw experimental data from public repositories (SRA, GEO, ArrayExpress,
  ENA, PRIDE, ClinVar, gnomAD, GTEx) or SME-supplied paths. Emits a cohort manifest,
  per-accession provenance summary, and an index pointing at the materialized
  artifacts. Downstream atoms consume the manifest, not the raw bytes directly.

  RECORD-WHAT-YOU-DID (audit, not instruction): if the source you actually read
  DIFFERS in any way from the source that was requested — the requested path or
  accession was absent, unreachable, embargoed, or served a different data form,
  and you fell back to a redistribution, a mirror, a bundled package, a
  different accession, or locally generated data — write a `source_deviation`
  object at the top level of result.json. This does NOT authorise a
  substitution and does NOT tell you which source to prefer; it says that if you
  substitute, you must state it. Record:
    - requested: the source that was asked for, verbatim (path, accession, URL,
      package name — whatever intake named).
    - requested_available: true/false — was the requested source reachable at
      the time you ran? false = the substitution was forced; true = you swapped
      a source that WAS available.
    - used: the source you actually read.
    - used_kind: its class — one of package / accession / local_path / url /
      mirror / synthetic, or another short label if none of those fits.
    - used_version: the version, release, revision, or accession that pins
      `used` (omit only when the substitute carries no version handle).
    - reason: why you substituted, in one or two sentences.
    - checksums: an object mapping each materialized input file (path relative
      to your task output dir) to its sha256, so a reviewer can confirm which
      bytes were analysed.
  Whatever you name in `used` MUST agree with the source your
  per_accession_summary.json describes — the harness cross-checks the two and
  blocks the task if they contradict. Do NOT write runtime/decisions.jsonl: the
  harness reads this block and appends the typed decision record itself. If you
  read exactly the requested source, OMIT the key entirely. A file or directory
  in runtime/inputs.json is a requested source: reading those registered bytes
  unchanged is not a fallback and MUST NOT produce `source_deviation`.
edam_operation: "operation:2422"
edam_data: "data:2531"
edam_format: "format:3915"
assignee: agent
expected_artifacts:
  - cohort_manifest.tsv
  - per_accession_summary.json
  - matrices_index.json
  - manifest.json
  - result.json
required_figures:
  - samples_per_study
attributes:
  data_sources:
    - sra
    - geo
    - arrayexpress
    - ena
    - pride
    - synapse
    - dbgap
    - egastudy
    - sme_provided
  # NOTE: `required_input_stage` is NOT declared here. It is injected by the
  # composer at compose time (composer_v4::planner::stamp_required_input_stage)
  # onto this staging anchor's node attributes and folded into task-spec.json's
  # `spec` by the WORKFLOW.json lowering pass. Its value is the resolved
  # composed-DAG entry-point EDAM IRI (default data:2044 = raw reads; otherwise
  # a processed-product IRI when the DAG is downstream-first). The executing
  # agent reads it via scripts/agent-prompts/task-execution.md to fetch the
  # right input stage instead of substituting an easier deposited artifact.
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
safety:
  # Fetches raw experimental data from public repositories (SRA / GEO /
  # ArrayExpress / ENA / PRIDE / Synapse) over the internet. Without this
  # block the atom defaults to no-network (Compute / None{[]}) — a false
  # "hermetic" claim that a downstream offline-replay capability check
  # would trust. The repository host set is broad and mirror/CDN-backed
  # (SRA alone routes through NCBI + AWS + GCP mirrors), so this declares
  # the open Bridge policy rather than a fragile curated allowlist. The
  # controlled-access variant (dbGaP / EGA) is a separate atom that stays
  # isolated for its no-egress-backend contract.
  level: network
  network:
    kind: bridge
# Explicit rich ports.
# Inputs are SME-declared accessions / paths from intake (modeled as a
# ecaax:accession_descriptor local extension since EDAM lacks a clean
# term for "SRA accession descriptor"). The primary output is raw
# FASTQ; richer modalities may add per-sample metadata.
inputs:
  - name: accession_descriptors
    semantic_type:
      kind: local_extension
      namespace: "ecaax"
      id: "accession_descriptor"
      proposed_parent_terms:
        - "data:2531"
      definition: "SME-declared repository accession or file path (SRA, GEO, ENA, PRIDE, dbGaP, EGA, SME-provided)"
    privacy_class: internal
outputs:
  - name: cohort_manifest
    semantic_type:
      kind: ontology_term
      iri: "data:2531"
      label: "Experiment annotation"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    privacy_class: internal
  - name: raw_count_matrix
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "raw_counts"
    cardinality: { kind: optional }
    privacy_class: internal
  - name: raw_reads
    semantic_type:
      kind: ontology_term
      iri: "data:2044"
      label: "Sequence reads"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:1930"
      label: "FASTQ"
    privacy_class: internal
