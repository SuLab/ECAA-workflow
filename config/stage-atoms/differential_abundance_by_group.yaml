id: differential_abundance_by_group
version: "1.0.0"
role: operation
# Confirmatory result-producing stage: emits a per-feature association
# table (effect size + p / adjusted-p) the verifier can recompute.
confirmatory: true
description: |
  USE ONLY WHEN the question names (or clearly implies) a CONTRAST
  between two or more sample groups — responders vs non-responders,
  tumour subtype A vs B, carriers vs non-carriers, treated vs control.
  DO NOT use this for a single-cohort descriptive question that has no
  group to contrast against — e.g. "what are the TOP MUTATED / most
  frequent genes", a mutation-frequency landscape, or a ranked summary
  over one cohort. Those need a frequency / ranking / landscape summary
  (author one via `agent_generated_analysis` if no catalog atom fits),
  NOT a between-group abundance test; binding this atom there invents a
  contrast the data does not contain.

  Test which features (genes / mutations / proteins / metabolites) are
  significantly enriched or differ in abundance between two SME-named
  sample groups (e.g., responders vs non-responders, carriers vs
  non-carriers). Method-neutral over the association-test family: a
  contingency test for presence/absence of a discrete feature, a
  rank-based test for a continuous abundance, or a covariate-adjusted
  regression — fisher_exact / logistic_regression / mann_whitney /
  limma selected at runtime based on the feature type (binary vs
  continuous) and whether covariates must be adjusted. Emits a
  per-feature association table with effect size, p-value, and a
  multiple-testing-adjusted p-value.

  RECORD-WHAT-YOU-DID (audit, not instruction): in result.json, write
  down the test you actually ran so it can be audited — this does NOT
  tell you which test to use, only to state your own choice. Record:
    - test_used: the statistical test / model you ran (e.g.
      "Fisher exact", "logistic regression ~ group + age + sex",
      "Mann-Whitney U").
    - group_variable: the two-level grouping variable being compared
      (e.g. "response_status": responder vs non-responder).
    - feature_type: whether the per-feature value tested was a discrete
      count/presence ("categorical") or a continuous abundance
      ("continuous").
    - available_covariates: the covariate columns you observed in the
      sample metadata (your honest list of what was available).
    - multiple_testing_method: the adjustment you applied across
      features (e.g. "BH", "Bonferroni").
  These are YOUR record of YOUR choices and of the data/task — a
  domain-correctness contract checks them for internal + task
  consistency. It never prescribes a test.
edam_operation: "operation:3223"
edam_data: "data:0951"
edam_format: "format:3475"
assignee: agent
depends_on:
  - quantification
expected_artifacts:
  - group_association.tsv
  - group_association_summary.json
  - manifest.json
  - result.json
plot_stage_id: differential_expression
required_figures:
  - volcano
  - top_features_heatmap
attributes:
  candidate_tools:
    - fisher_exact
    - logistic_regression
    - mann_whitney
    - limma
  # Method-neutral record-what-you-did contract consumed by the harness
  # method-correctness validation. The agent records the fields below in
  # result.json describing its OWN test + its OWN observation of the
  # data/task — NOT a prescription of which test to run.
  result_contract:
    record_in_result_json:
      - test_used
      - group_variable
      - feature_type
      - available_covariates
      - multiple_testing_method
    note: >-
      record-what-you-did, not be-told-what-to-do. State the test you
      ran and the covariate columns you observed; the harness checks
      your own record for domain-correctness (e.g. a continuous feature
      is not tested with a contingency test, a multiple-testing
      adjustment is reported). No threshold or row-filter is prescribed.
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
claim_boundary: |
  Differential abundance between two groups is a statistical
  association, not biological causation. Report the effect size (odds
  ratio / log fold-change / rank-difference), the p-value, the
  multiple-testing-adjusted p-value, and the two compared group levels
  for every feature. Prefer "enriched in" / "associated with" over
  "drives" / "causes". A feature enriched in a group is not evidence
  that the feature is responsible for the group's phenotype.
# Explicit rich ports.
# Input is a feature x sample matrix (or a per-feature table) paired
# with a group label per sample; output is the per-feature association
# table with effect size + p-value + adjusted p-value.
inputs:
  - name: feature_matrix
    semantic_type:
      kind: ontology_term
      iri: "data:3917"
      label: "Count matrix"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    privacy_class: internal
  - name: group_labels
    semantic_type:
      kind: ontology_term
      iri: "topic:3678"
      label: "Experimental design and studies"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3464"
      label: "JSON"
    privacy_class: internal
outputs:
  - name: group_association
    semantic_type:
      kind: local_extension
      namespace: "ecaax"
      id: "group_association_table"
      # Parent the output on the DE-results type so the figure resolver
      # reuses the differential_expression renderer (volcano + top-features
      # heatmap) — a per-feature effect-size + p-value table is a
      # differential result, not an enrichment-terms table.
      proposed_parent_terms:
        - "data:3134"
      definition: "Per-feature group-association table (effect size, p-value, multiple-testing-adjusted p-value) comparing two SME-named sample groups."
    physical_format:
      iri: "format:3475"
      label: "Tabular text"
    statistical_state: "multiple_testing_corrected"
    privacy_class: internal
