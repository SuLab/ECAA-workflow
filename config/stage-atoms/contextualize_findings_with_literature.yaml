id: contextualize_findings_with_literature
version: "1.0.0"
role: operation
description: |
  Map each row of the upstream findings table (DE genes / called peaks /
  called variants) to PMID-anchored prior-work rows. Emit
  claims_evidence_matrix.csv with deterministic concordance flags
  (same_direction / opposite_direction / no_prior_finding / unverifiable /
  not_assessed). No synthesis; no narrative.
edam_operation: "operation:0305"
assignee: agent
depends_on:
  - review_prior_work
inputs:
  - name: analysis_findings
    # Now uses SemanticType::Union to route across three
    # archetype claim shapes (DE results / peak calls / variant calls).
    # See claim_shape_branch attribute for agent prompt selection.
    semantic_type:
      kind: union
      members:
        - kind: ontology_term
          iri: "data:0951"
          label: "Statistical estimate score"
          ontology_version: "EDAM-1.25"
        - kind: ontology_term
          iri: "data:3002"
          label: "Annotation track"
          ontology_version: "EDAM-1.25"
        - kind: ontology_term
          iri: "data:3498"
          label: "Sequence variations"
          ontology_version: "EDAM-1.25"
    physical_format: { iri: "format:3475", label: "Tabular text" }
    statistical_state: any_tested
    privacy_class: internal
  - name: prior_claims_matrix
    semantic_type:
      kind: ontology_term
      iri: "ecaax:literature_claims_matrix"
      label: "Literature claims matrix"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:3752", label: "CSV" }
    privacy_class: internal
outputs:
  - name: claims_evidence_matrix
    semantic_type:
      kind: ontology_term
      iri: "ecaax:claims_evidence_matrix"
      label: "Claims-evidence matrix"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:3752", label: "CSV" }
    privacy_class: internal
  - name: literature_search_protocol
    semantic_type:
      kind: ontology_term
      iri: "ecaax:literature_search_protocol"
      label: "Literature search protocol"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:1196", label: "Markdown" }
    privacy_class: internal
  - name: citation_verification_report
    semantic_type:
      kind: ontology_term
      iri: "ecaax:citation_verification_report"
      label: "Citation verification report"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:1196", label: "Markdown" }
    privacy_class: internal
attributes:
  claim_shape_branch:
    selector: input.analysis_findings.semantic_type.iri
    cases:
      "data:0951": gene
      "data:3002": region
      "data:3498": variant
expected_artifacts:
  - claims_evidence_matrix.csv
  - literature_search_protocol.md
  - citation_verification_report.md
  - evidence/manifest.json
  - result.json
required_artifacts:
  - path: claims_evidence_matrix.csv
    schema_ref: schemas/claims_evidence_matrix.schema.json
  - path: evidence/manifest.json
    schema_ref: schemas/literature_evidence_manifest.schema.json
validators:
  - pmid_resolves
  - evidence_quote_substring_match
  - redistributable_or_marked
  - claim_row_has_finding_id
  - concordance_flag_in_closed_set
  - direction_supported_by_quote
  - gene_symbol_ensembl_consistent
figure_exempt:
  reason: "Structured-text outputs only."
  category: non_plottable
resource_profile: { cpu: light, memory: small, gpu: false, runtime_class: minutes }
safety:
  # Retrieves primary literature (PubMed/PMC) + proceedings the same way
  # survey_method_landscape does, so it carries the identical bounded egress
  # allowlist. Without this block the atom defaults to no-network and the agent
  # self-blocks with LiteratureRetrievalNetworkNotAuthorized.
  level: network
  network:
    kind: none
    allowlist:
      - eutils.ncbi.nlm.nih.gov
      - ftp.ncbi.nlm.nih.gov
      - api.openalex.org
      - api.crossref.org
      - readthedocs.io
      - bioconductor.org
      - github.com
      - raw.githubusercontent.com
      - nf-co.re
claim_boundary: |
  This atom emits row-level concordance flags ONLY. Each row references one
  upstream finding (finding_id), zero or more prior PMIDs, and a closed-set
  concordance flag whose semantics are: same_direction iff the prior's effect
  direction matches the analysis effect direction AND both effect-size
  magnitudes are >0; opposite_direction iff signs differ; no_prior_finding
  iff a literature query WAS ACTUALLY ISSUED for this entity and returned zero
  usable prior rows (searched, nothing found); unverifiable iff prior rows
  exist but their evidence_quote does not specify a direction; not_assessed
  iff retrieval was NOT performed for this entity — it lies outside the set of
  entities a query was issued for. no_prior_finding and not_assessed are
  distinct and MUST NOT be conflated: absence of retrieved evidence for an
  entity you never searched is not a "no prior finding" result, and downstream
  reporting treats only the searched no_prior_finding set as candidate-novel.
  Do NOT introduce composite or narrative claims. Do NOT generate paragraphs
  that the upstream atom did not also generate row-wise.

  EVIDENCE GATING (MANDATORY; enforced by post-task validation): cite a prior
  PMID — and assert same_direction / opposite_direction / unverifiable — ONLY
  for a PMID that has a DOWNLOADED evidence snapshot you can point to (a
  snapshots/<sha256> file recorded in an evidence/manifest.json, either this
  task's own or an upstream literature task's such as review_prior_work /
  survey_method_landscape). Before writing ANY PMID into
  claims_evidence_matrix.csv, confirm it resolves to such a manifest entry; if it
  does not, DROP the citation and leave the prior PMID column empty. Choose the
  flag by whether a query was issued for that entity: set no_prior_finding only
  if you ACTUALLY searched for this entity and found no usable prior row; set
  not_assessed if you did not perform retrieval for this entity (it was outside
  the searched set). NEVER cite a PMID from memory, from the finding's
  gene/region/variant name, or one you have not actually retrieved — an
  unretrieved PMID is an unsupported claim and will block the workflow. Record
  every PMID you DO cite as an entry in THIS task's evidence/manifest.json
  (reuse the upstream snapshot path) so downstream validation resolves it.

  Gene-identity rule (MANDATORY): gene symbols MUST be resolved to Ensembl IDs
  using the run's pinned genome annotation (org.Hs.eg.db / biomaRt at the
  package's Ensembl release), OR by joining on the Ensembl IDs already present
  in the upstream differential-expression table (de_results.tsv gene_id column).
  You MUST NOT hardcode Ensembl IDs and you MUST NOT recall them from memory; do
  not embed a literal symbol→Ensembl map in the script. You MUST NOT fall back to
  a literal ID when a lookup fails — on lookup failure, mark the gene unresolved
  rather than guessing. Resolution goes through the pinned annotation/adapter or
  the upstream table only. Every emitted finding_id must be an Ensembl ID that
  appears in the upstream DE table or is explicitly flagged absent. For every
  gene row, ALSO populate the `entity` column with that gene's HGNC symbol (and
  entity_kind = gene), carried straight from the same annotation join used for
  the Ensembl id — so the independent gene-symbol↔Ensembl consistency check can
  confirm the citation is attached to the right gene.
