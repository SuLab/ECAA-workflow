id: contextualize_findings_with_literature
version: "1.0.0"
role: operation
description: |
  Map each row of the upstream findings table (DE genes / called peaks /
  called variants) to PMID-anchored prior-work rows. Emit
  claims_evidence_matrix.csv with deterministic concordance flags
  (same_direction / opposite_direction / no_prior_finding / unverifiable /
  not_assessed). No synthesis; no narrative.

  DO NOT hand-write this mapping. The package ships a tested, deterministic
  implementation at runtime/literature/; call it and let it write every
  declared artifact:

    python3 -m runtime.literature \
      --results      runtime/outputs/<upstream_stage>/<results_table> \
      --symbol-column <column holding the entity label> \
      --effect-column <signed-effect column> \
      --significance-column <adjusted-p column> \
      --threshold    0.05 \
      --prior-claims runtime/outputs/review_prior_work/prior_claims_matrix.csv \
      --retrieval-scope runtime/outputs/review_prior_work/retrieval_scope.json \
      --evidence-manifest runtime/outputs/review_prior_work/evidence/manifest.json \
      --out-dir      runtime/outputs/contextualize_findings_with_literature \
      --entity-kind  gene|region|variant \
      --contrast-term <perturbation> [--contrast-term <synonym> ...]

  It writes claims_evidence_matrix.csv, evidence/manifest.json,
  annotation/symbol_map.tsv, literature_search_protocol.md and
  citation_verification_report.md, and prints a JSON summary on stdout to fold
  into result.json. Run it from the package root. Column arguments are
  optional — omitted, each is resolved from a declared candidate list — but
  naming them explicitly is preferred, and a named column that is absent from
  the header is a hard error rather than a silent fallback to a different
  measurement.

  YOUR ONLY PREPARATORY STEP is the identity join: the library does not
  resolve identifiers, so if the results table has no entity-label column,
  add one using the run's pinned annotation (see the gene-identity rule
  below) and pass it as --symbol-column. Write that joined table under this
  task's own output dir, NOT under intermediates/ — the deposit export drops
  every intermediates/ path, so a join left there is absent from the deposit.
  The library then records the mapping it read as the declared artifact
  annotation/symbol_map.tsv (tab-delimited, header `symbol` then
  `ensembl_gene_id`, one row per distinct mapping, sorted by accession). Do
  NOT hand-write, rename, or post-edit that file, and do not invent a
  different filename for it: it is the table the independent
  entity-label ↔ accession consistency check reads.

  The library derives PMIDs, quotes, offsets, source hashes and prior
  directions from the retrieved snapshots themselves, and the analysis
  direction from the sign of the effect column. Do not pass any of them in,
  and do not post-edit the emitted CSV.
edam_operation: "operation:0305"
assignee: agent
depends_on:
  - review_prior_work
inputs:
  - name: analysis_findings
    # Now uses SemanticType::Union to route across three
    # archetype claim shapes (DE results / peak calls / variant calls).
    # See claim_shape_branch attribute for agent prompt selection.
    semantic_type:
      kind: union
      members:
        - kind: ontology_term
          iri: "data:3134"
          label: "Gene expression data"
          ontology_version: "EDAM-1.25"
        - kind: ontology_term
          iri: "data:0951"
          label: "Statistical estimate score"
          ontology_version: "EDAM-1.25"
        - kind: ontology_term
          iri: "data:3002"
          label: "Annotation track"
          ontology_version: "EDAM-1.25"
        - kind: ontology_term
          iri: "data:3498"
          label: "Sequence variations"
          ontology_version: "EDAM-1.25"
    physical_format: { iri: "format:3475", label: "Tabular text" }
    statistical_state: any_tested
    privacy_class: internal
  - name: prior_claims_matrix
    semantic_type:
      kind: ontology_term
      iri: "ecaax:literature_claims_matrix"
      label: "Literature claims matrix"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:3752", label: "CSV" }
    privacy_class: internal
outputs:
  - name: claims_evidence_matrix
    semantic_type:
      kind: ontology_term
      iri: "ecaax:claims_evidence_matrix"
      label: "Claims-evidence matrix"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:3752", label: "CSV" }
    privacy_class: internal
  - name: literature_search_protocol
    semantic_type:
      kind: ontology_term
      iri: "ecaax:literature_search_protocol"
      label: "Literature search protocol"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:1196", label: "Markdown" }
    privacy_class: internal
  - name: citation_verification_report
    semantic_type:
      kind: ontology_term
      iri: "ecaax:citation_verification_report"
      label: "Citation verification report"
      ontology_version: "ecaax-1"
    physical_format: { iri: "format:1196", label: "Markdown" }
    privacy_class: internal
attributes:
  claim_shape_branch:
    selector: input.analysis_findings.semantic_type.iri
    cases:
      "data:3134": gene
      "data:0951": gene
      "data:3002": region
      "data:3498": variant
expected_artifacts:
  - claims_evidence_matrix.csv
  - annotation/symbol_map.tsv
  - literature_search_protocol.md
  - citation_verification_report.md
  - evidence/manifest.json
  - result.json
required_artifacts:
  - path: claims_evidence_matrix.csv
    schema_ref: schemas/claims_evidence_matrix.schema.json
  - path: evidence/manifest.json
    schema_ref: schemas/literature_evidence_manifest.schema.json
  # The entity-label ↔ accession mapping the run's identity join supplied,
  # written by `runtime/literature` as a two-column TSV (`symbol`,
  # `ensembl_gene_id`). Declared so the consistency obligation reads a known
  # table instead of scavenging the output tree, and deliberately NOT under
  # intermediates/ (Tier-E: dropped from every exported deposit, which left the
  # obligation undischargeable there). No schema_ref: the artifact-schema check
  # applies to `.json` payloads only, and the header IS the contract here.
  - path: annotation/symbol_map.tsv
validators:
  - pmid_resolves
  - evidence_quote_substring_match
  - redistributable_or_marked
  - claim_row_has_finding_id
  - concordance_flag_in_closed_set
  - direction_supported_by_quote
  - gene_symbol_ensembl_consistent
figure_exempt:
  reason: "Structured-text outputs only."
  category: non_plottable
resource_profile: { cpu: light, memory: small, gpu: false, runtime_class: minutes }
safety:
  # Retrieves primary literature (PubMed/PMC) + proceedings the same way
  # survey_method_landscape does, so it carries the identical bounded egress
  # allowlist. Without this block the atom defaults to no-network and the agent
  # self-blocks with LiteratureRetrievalNetworkNotAuthorized.
  level: network
  network:
    kind: none
    allowlist:
      - eutils.ncbi.nlm.nih.gov
      - ftp.ncbi.nlm.nih.gov
      - api.openalex.org
      - api.crossref.org
      - readthedocs.io
      - bioconductor.org
      - github.com
      - raw.githubusercontent.com
      - nf-co.re
claim_boundary: |
  This atom emits row-level concordance flags ONLY. Each row references one
  upstream finding (finding_id), zero or more prior PMIDs, and a closed-set
  concordance flag whose semantics are: same_direction iff the prior's effect
  direction matches the analysis effect direction AND both effect-size
  magnitudes are >0; opposite_direction iff signs differ; no_prior_finding
  iff a literature query WAS ACTUALLY ISSUED for this entity and returned zero
  usable prior rows (searched, nothing found); unverifiable iff retained prior
  evidence names the entity but does not specify a direction; not_assessed iff
  no entity-specific query was issued and the bounded retained evidence corpus
  contains no exact entity mention. no_prior_finding and not_assessed are
  distinct and MUST NOT be conflated: absence of retrieved evidence for an
  entity you never searched is not a "no prior finding" result, and downstream
  reporting treats only the searched no_prior_finding set as candidate-novel.
  Read the searched boundary from upstream retrieval_scope.json, which retains
  zero-result axes. Do not reconstruct it solely from prior_claims_matrix.csv:
  a query that found no usable source emits no claims-matrix row.
  Do NOT introduce composite or narrative claims. Do NOT generate paragraphs
  that the upstream atom did not also generate row-wise.

  SHARED IMPLEMENTATION (MANDATORY): produce claims_evidence_matrix.csv by
  invoking runtime/literature (`python3 -m runtime.literature`, arguments in
  this atom's description), not by writing a bespoke script.
  Every rule below is already enforced there: PMIDs are accepted only when
  they resolve to a manifest entry whose snapshot is on disk and whose bytes
  hash to the recorded digest; quotes are extracted from that snapshot and
  re-verified as verbatim substrings at a recorded offset; prior directions
  are derived from the quoted sentence and analysis directions from the sign
  of the effect column. Entity-specific query scope is taken from
  retrieval_scope.json plus the prior-claims query axes (or an explicit
  --searched-entities list), never guessed. The deterministic library also
  scans the bounded retained evidence corpus for exact mentions of findings
  not named by an entity-specific axis. A positive exact mention remains
  citable evidence; an absent mention remains not_assessed and MUST NOT be
  promoted to no_prior_finding. A run that embeds a PMID, a quote, a direction
  label, or a sha256 digest as a literal in a task script is non-compliant even
  if its output happens to validate.

  EVIDENCE GATING (MANDATORY; enforced by post-task validation): cite a prior
  PMID — and assert same_direction / opposite_direction / unverifiable — ONLY
  for a PMID that has a DOWNLOADED evidence snapshot you can point to (a
  snapshots/<sha256> file recorded in an evidence/manifest.json, either this
  task's own or an upstream literature task's such as review_prior_work /
  survey_method_landscape). Before writing ANY PMID into
  claims_evidence_matrix.csv, confirm it resolves to such a manifest entry; if
  it does not, DROP the citation and leave the prior PMID column empty. Choose
  the flag from the retained retrieval record: set no_prior_finding only if an
  entity-specific query was ACTUALLY issued and found no usable prior row. If
  no entity-specific query was issued, retain an exact entity mention found in
  the bounded snapshots as positive evidence, but set not_assessed when no such
  mention exists. NEVER cite a PMID from memory, from the finding's
  gene/region/variant name, or one you have not actually retrieved — an
  unretrieved PMID is an unsupported claim and will block the workflow. Record
  every PMID you DO cite as an entry in THIS task's evidence/manifest.json
  (reuse the upstream snapshot path) so downstream validation resolves it.

  Gene-identity rule (MANDATORY): gene symbols MUST be resolved to Ensembl IDs
  using the run's pinned genome annotation (org.Hs.eg.db / biomaRt at the
  package's Ensembl release), OR by joining on the Ensembl IDs already present
  in the upstream differential-expression table (de_results.tsv gene_id column).
  You MUST NOT hardcode Ensembl IDs and you MUST NOT recall them from memory; do
  not embed a literal symbol→Ensembl map in the script. You MUST NOT fall back to
  a literal ID when a lookup fails — on lookup failure, mark the gene unresolved
  rather than guessing. Resolution goes through the pinned annotation/adapter or
  the upstream table only. Every emitted finding_id must be an Ensembl ID that
  appears in the upstream DE table or is explicitly flagged absent. For every
  gene row, ALSO populate the `entity` column with that gene's HGNC symbol (and
  entity_kind = gene), carried straight from the same annotation join used for
  the Ensembl id — so the independent gene-symbol↔Ensembl consistency check can
  confirm the citation is attached to the right gene. That check reads the
  mapping from the declared artifact
  runtime/outputs/<this task>/annotation/symbol_map.tsv — tab-delimited, header
  `symbol` then `ensembl_gene_id`, one row per distinct mapping — which
  `python3 -m runtime.literature` writes for you from the very columns you
  passed it. Do not write it yourself, do not put it under intermediates/ (the
  deposit export drops that path), and do not substitute a differently-named
  file: the mapping must be the one your join actually supplied, recorded where
  a deposit keeps it.
