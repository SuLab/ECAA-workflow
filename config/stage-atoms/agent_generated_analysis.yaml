id: agent_generated_analysis
version: "1.0.0"
role: operation
description: |
  Exploratory custom analysis authored by the execution agent at runtime.
  The agent generates a self-contained script for an analysis step the
  catalog does not provide a fixed atom for. The generated code runs under
  mandatory process-isolation (bubblewrap on Local; equivalent on remote),
  network-denied (enforced on SLURM/AWS; on the Local executor network is
  NOT denied — see docs/known-limitations.md), with host secrets stripped.
  This atom exists to exercise
  the Exec -> GeneratedByAgent -> ProcessIsolation defence-in-depth path in
  a shipped workflow; it is opt-in (seeded only behind an explicit
  "exploratory custom analysis" goal pattern).
edam_operation: "operation:2945"
edam_data: "data:2531"
edam_format: "format:3475"
assignee: agent
governance:
  status: reviewed
  reviewed_by: "ecaa-governance"
  review_date: "2026-06-02"
expected_artifacts:
  - analysis.py
  - result.json
figure_exempt:
  reason: "Output shape is agent-defined at runtime; no static figure obligation."
  category: non_plottable
safety:
  level: exec
  code_execution: generated_by_agent
  sandbox: process_isolation
  provisioning: declared_only
