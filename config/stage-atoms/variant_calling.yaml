id: variant_calling
version: "1.0.0"
role: operation
# Confirmatory result-producing stage: anchors a Required recall expectation.
confirmatory: true
description: |
  Call germline or somatic SNVs / indels from aligned reads. HaplotypeCaller /
  DeepVariant / Mutect2 / Strelka2 selected at runtime by experimental design
  (germline cohort vs tumor-normal pair vs tumor-only).
edam_operation: "operation:3227"
edam_data: "data:0863"
edam_format: "format:3016"
assignee: agent
depends_on:
  - alignment
attributes:
  candidate_tools:
    - haplotypecaller
    - deepvariant
    - mutect2
    - strelka2
    - dragen
    - lofreq
  # Triggers the AF-spectrum measurement runbook injection in
  # scripts/agent-claude.sh (gated on attributes.measurement_script) so the
  # agent runs the byte-pinned lib/measure_af_spectrum.py verbatim against its
  # CALLED VCF. variant_calling and variant_filtering both run it so the
  # cross-stage `filtered_le_called` / `sample_count_consistent` assertions and
  # the per-stage AF-spectrum / per-sample-count assertions read deterministic,
  # operator-authored metrics from result.json on BOTH ends of the comparison.
  measurement_script: measure_af_spectrum.py
resource_profile:
  cpu: heavy
  memory: large
  gpu: false
  runtime_class: hours
# Explicit rich ports.
inputs:
  - name: aligned_reads
    semantic_type:
      kind: ontology_term
      iri: "data:0863"
      label: "Sequence alignment"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:2572"
      label: "BAM"
    privacy_class: internal
outputs:
  - name: variants
    semantic_type:
      kind: ontology_term
      iri: "data:3498"
      label: "Sequence variations"
      ontology_version: "EDAM-1.25"
    physical_format:
      iri: "format:3016"
      label: "VCF"
    privacy_class: internal
# Hard artifact the harness verifies before accepting completion. Naming
# result.json attaches this atom's validators to the emitted
# RequiredArtifact.validation_obligations and gates the AF-spectrum metrics the
# measurement script writes (same contract as variant_filtering).
required_artifacts:
  - path: result.json
    min_size_bytes: 2
# Validator obligations run by the harness against the emitted VCF +
# result.json. companion_synthesis synthesizes validate_variant_calling
# from this list; the harness routes each id to its ValidatorRunner.
# Coordinate sanity is the domain invariant: every called position must
# fall inside its declared contig. Determinism guards against a
# nondeterministic caller. AF-spectrum + per-sample-count sanity is
# additionally enforced by the goal-driven validation-contract-variants
# assertion arms (numeric_distribution / reference_range_outlier).
validators:
  - coordinate_in_contig
  - deterministic_or_bounded_variance
  - variant_af_spectrum_plausible
