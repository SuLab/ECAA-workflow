id: hydrologic_qc
version: "1.0.0"
role: operation
description: |
  Quality-control a river-discharge time series: flag physically-impossible
  values (negative discharge, sensor spikes), gap-fill short missing runs, and
  emit a cleaned panel with a QC audit column. Method-neutral — the agent
  selects the gap-fill and outlier-detection approach at runtime.
edam_operation: "ecaax:hydrologic_quality_control"
edam_data: "data:0951"
edam_format: "format:3475"
assignee: agent
depends_on: [data_import]
figure_exempt:
  reason: "QC is a data-cleaning step; its cleaned panel is consumed by decomposition, not plotted directly. The QC audit is a structured JSON report, not an SME-facing figure."
  category: intermediate
expected_artifacts:
  - cleaned_discharge_panel.csv
  - qc_audit.json
  - result.json
resource_profile:
  cpu: moderate
  memory: medium
  gpu: false
  runtime_class: minutes
