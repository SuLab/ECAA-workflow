schema_version: "0.1"
id: variant_calling_germline
version: "1.0.0"
description: |
  Germline short-variant (SNV / indel) calling from WGS or WES. Standard
  pipeline: raw QC, trim, align, call variants, filter, annotate. Somatic
  / tumor-normal variants are out of scope; a separate archetype will
  cover that workload.
sme_summary: |
  Call and annotate germline SNVs and indels from whole-genome or
  whole-exome sequencing data.
goal_data: "data:3498"
goal_format: "format:3016"
project_class: bioinformatics
modality_hint: variant_calling
validation_contract_ref: validation-contract-variants.json
atoms:
  - atom_id: data_acquisition
    required: true
  - atom_id: raw_qc
    required: true
    depends_on: [data_acquisition]
  - atom_id: sequence_trimming
    required: false
    depends_on: [raw_qc]
  - atom_id: alignment
    required: true
    depends_on: [sequence_trimming]
  - atom_id: variant_calling
    required: true
    depends_on: [alignment]
  - atom_id: variant_filtering
    required: true
    depends_on: [variant_calling]
  - atom_id: variant_annotation
    required: true
    depends_on: [variant_filtering]
  - atom_id: differential_abundance_by_group
    # Optional analysis branch (mutation-analysis task type): when the SME
    # asks which variants/genes are enriched between two sample groups
    # (e.g. responders vs non-responders), this atom binds a per-feature
    # group-association test instead of the generic descriptive summary.
    # Pruned when the intake supplies no two-group label. A single-cohort
    # "top / most-frequent mutated genes" or mutation-landscape question
    # has NO contrast and must NOT bind this atom (author a frequency /
    # ranking summary instead — see the atom description's USE-ONLY-WHEN
    # gate). Mirrors the pathway_enrichment optional-atom wiring in
    # bulk_rnaseq_de.yaml.
    required: false
    depends_on: [variant_annotation]
  - atom_id: review_prior_work
    required: false
    # Literature-review atom. The v4 composer includes this +
    # contextualize_findings_with_literature unconditionally; literature
    # contextualization is not gated on intake. `required: false` means the
    # archetype tolerates its absence, not that it is pruned.
  - atom_id: contextualize_findings_with_literature
    required: false
    depends_on: [variant_annotation, review_prior_work]
  - atom_id: reporting
    required: true
    # reporting must also consume contextualize_findings_with_literature when
    # present so it doesn't dangle as an orphan operation node in the
    # lowered DAG (audit-dag.py OPERATION_ORPHANS check). Same for the
    # optional differential_abundance_by_group branch.
    depends_on:
      - variant_annotation
      - differential_abundance_by_group
      - contextualize_findings_with_literature
  - atom_id: final_reporting
    required: true
    depends_on: [reporting]
slot_mappings:
  organism: alignment.inputs.organism
  reference_build: alignment.inputs.reference_build
  samples: data_acquisition.inputs.samples
  capture_kit: alignment.inputs.capture_kit
claim_boundary: |
  Variant calls are computational predictions; annotation pathogenicity is
  curator-assigned and may lag literature. Report the caller, filter
  strategy, and annotation source for every variant. Do not assert
  clinical interpretation beyond what the cited annotation source supports.
ordering_only_edges:
  - { from: contextualize_findings_with_literature, to: reporting }
  - { from: differential_abundance_by_group, to: reporting }
  - { from: raw_qc, to: sequence_trimming }
  - { from: variant_annotation, to: differential_abundance_by_group }
  - { from: variant_annotation, to: reporting }
