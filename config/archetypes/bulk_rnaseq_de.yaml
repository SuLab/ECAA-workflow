schema_version: "0.1"
id: bulk_rnaseq_de
version: "1.0.0"
description: |
  Bulk RNA-seq differential expression analysis. Standard pipeline: raw QC,
  trim, align, quantify, normalise, test for DE between conditions, then
  pathway enrichment on the ranked DE result.
sme_summary: |
  Compare gene expression between two or more bulk RNA-seq conditions and
  report the differentially expressed genes plus pathway enrichment.
goal_data: "data:0951"
goal_format: "format:3475"
project_class: bioinformatics
modality_hint: bulk_rnaseq
# Per-stage method-correctness contract emitted into policies/validation-contract.json
# and enforced by the harness's enforce_validation_contract. Stage key
# `differential_expression` carries the design-covariate-adjustment +
# response-vs-stated-outcome assertions that catch a covariate-omitting DESeq2
# design (da-15-1) and an inverted regression (da-8-1). Method-neutral: the
# assertions check the agent's OWN recorded model fields against the agent's own
# record of the data/task — they never prescribe a model. See the contract's
# description and docs/known-limitations.md.
validation_contract_ref: validation-contract-association.json
atoms:
  - atom_id: data_acquisition
    required: true
  - atom_id: raw_qc
    required: true
    depends_on: [data_acquisition]
  - atom_id: sequence_trimming
    required: true
    depends_on: [raw_qc]
  - atom_id: alignment
    required: true
    depends_on: [sequence_trimming]
  - atom_id: quantification
    required: true
    depends_on: [alignment]
  - atom_id: qc_preprocessing
    required: true
    depends_on: [quantification]
  - atom_id: normalisation
    required: true
    # RCA I-1 — normalisation legitimately reads data_acquisition's
    # sample metadata (cohort_manifest) for its design formula
    # (condition / batch / cell line), not just qc_preprocessing's
    # count matrix. See normalisation.yaml's sample_metadata port.
    depends_on: [qc_preprocessing, data_acquisition]
  - atom_id: review_prior_work
    required: false
    # Literature-review atom. The v4 composer includes this +
    # contextualize_findings_with_literature unconditionally; literature
    # contextualization is not gated on intake. `required: false` means the
    # archetype tolerates its absence, not that it is pruned.
  - atom_id: differential_expression
    required: true
    # DE's `counts` one-of binds `raw_counts` from `qc_preprocessing`
    # (feature/sample-filtered raw counts for count-GLM tools) and
    # `normalized_counts` from `normalisation` (rank-based tools).
    # `data_acquisition` supplies the tabular sample metadata needed for the
    # fitted design. On a counts-first path, input-stage pruning rewires the
    # quantification-to-QC edge onto `data_acquisition`; QC remains the
    # canonical raw-count handoff into DE. Method-neutral: both count
    # substrates are offered and the runtime method choice selects one.
    depends_on: [qc_preprocessing, normalisation, data_acquisition]
  - atom_id: contextualize_findings_with_literature
    required: false
    depends_on: [differential_expression, review_prior_work]
  - atom_id: pathway_enrichment
    required: false
    depends_on: [differential_expression]
  - atom_id: reporting
    required: true
    # Reporting must also consume pathway_enrichment when
    # present so it doesn't dangle as an orphan operation node in the
    # lowered DAG (audit-dag.py OPERATION_ORPHANS check).
    # Same for contextualize_findings_with_literature (Phase G).
    depends_on:
      - differential_expression
      - pathway_enrichment
      - contextualize_findings_with_literature
  - atom_id: final_reporting
    required: true
    depends_on: [reporting]
slot_mappings:
  contrast: differential_expression.inputs.contrast
  reference_level: differential_expression.inputs.reference_level
  organism: alignment.inputs.organism
  samples: data_acquisition.inputs.samples
claim_boundary: |
  Differential expression is statistical association across the SME-named
  contrast, not biological causation. Report effect size + adjusted p-value
  + the reference factor level; prefer "associated with" / "enriched in"
  over mechanistic language.
ordering_only_edges:
  - { from: contextualize_findings_with_literature, to: reporting }
  - { from: differential_expression, to: contextualize_findings_with_literature }
  - { from: differential_expression, to: pathway_enrichment }
  - { from: differential_expression, to: reporting }
  - { from: pathway_enrichment, to: reporting }
  - { from: raw_qc, to: sequence_trimming }
