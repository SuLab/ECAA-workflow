schema_version: "0.1"
id: generic_omics
version: "1.0.0"
description: |
  Catch-all archetype for off-topic prose that mentions omics data but
  carries no specific modality or goal phrase. MODALITY-AGNOSTIC: emits
  the universal `data_acquisition → generic_summary` pipeline so the SME
  sees something runnable; further analysis steps surface as SME-driven
  amendments rather than auto-emitted. Deliberately omits the
  sequencing-specific `raw_qc` (FastQC/MultiQC over FASTQ `raw_reads`),
  which hard-blocks on any non-sequencing input (e.g. tabular
  metabolomics) — QC belongs in the modality-specific archetypes.
sme_summary: |
  Generic catch-all: summarize the provided inputs in a table.
  Further analysis surfaces as SME amendments.
goal_data: "data:0006"
goal_format: "format:3475"
project_class: bioinformatics
modality_hint: generic_omics
atoms:
  - atom_id: data_acquisition
    required: true
  - atom_id: review_prior_work
    required: false
    # Literature-review atom. The v4 composer includes this +
    # contextualize_findings_with_literature unconditionally; literature
    # contextualization is not gated on intake. `required: false` means the
    # archetype tolerates its absence, not that it is pruned. Mirrors
    # bulk_rnaseq_de.yaml.
  - atom_id: generic_summary
    required: true
    depends_on: [data_acquisition]
  - atom_id: contextualize_findings_with_literature
    required: false
    depends_on: [generic_summary, review_prior_work]
  # Every emitted package terminates in a `reporting`/`final_reporting`
  # pair so the post-emit DAG audit (no isolated nodes, every primary
  # task reaches a terminal) holds even on the catch-all path that's
  # routinely augmented by promoted propose_hypothesized_node atoms
  # (Tier-B flex scenarios). Without these the audit reports no-terminal
  # on every promoted-proposal DAG.
  - atom_id: reporting
    required: true
    # Reporting must also consume contextualize_findings_with_literature
    # when present so it doesn't dangle as an orphan operation node in the
    # lowered DAG (audit-dag.py OPERATION_ORPHANS check). When the
    # literature atom is gated out the edge becomes a no-op the DAG drops.
    depends_on:
      - generic_summary
      - contextualize_findings_with_literature
  - atom_id: final_reporting
    required: true
    depends_on: [reporting]
claim_boundary: |
  Report QC metrics and summary counts as computed. Do not assert
  modality-specific biological interpretation; the archetype is a
  catch-all and downstream typed analysis is up to the SME.
ordering_only_edges:
  - { from: contextualize_findings_with_literature, to: reporting }
  - { from: generic_summary, to: contextualize_findings_with_literature }
  - { from: generic_summary, to: reporting }
