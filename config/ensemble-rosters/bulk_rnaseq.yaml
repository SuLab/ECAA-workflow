schema_version: "0.1"
modality: bulk_rnaseq
enabled: true
factorial: full
statistical_variants:
  - {id: deseq2, tool: deseq2, bootstrap_replicates: 0}
  - {id: edger,  tool: edger}
  - {id: limma,  tool: limma_voom}
# Interpretive lenses are the UNIVERSAL set now, composed per-analysis by
# EnsembleRosterProvider::compose_lenses: the 5 epistemic-core lenses
# (config/ensemble-lenses/) plus adaptively-selected biomedical subfields
# (config/ensemble-subfields/). Rosters no longer declare interpretive_lenses.
caps:
  # 5 core + up to 3 selected subfields = 8 lenses; full K×M expansion is
  # K(3) + M(8) + K*M(24) = 35 members, so the cap must clear 35.
  max_ensemble_members: 40
  per_ensemble_budget_usd: 60
  min_quorum_per_axis: 2
