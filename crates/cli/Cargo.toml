[package]
name = "ecaa-workflow-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SuLab/ECAA-workflow"
description = "Command-line front-end for the ecaa-workflow compiler (chat / intake / build / dag / serve)."

[[bin]]
name = "ecaa-workflow"
path = "src/main.rs"

[[bin]]
name = "ecaa-workflow-audit-proof"
path = "src/bin/ecaa-workflow-audit-proof.rs"

[dependencies]
ecaa-workflow-core = { version = "0.1", path = "../core" }
ecaa-workflow-conversation = { version = "0.1", path = "../conversation" }
ecaa-workflow-types = { version = "0.1", path = "../ecaa-types" }
# The standalone `ecaa-workflow-audit-proof` binary selects the
# runcrate-backed WRROC validator (`PythonRuncrateWrrocValidator`) when
# ECAA_CONFORMANCE_MODE is set. That adapter lives in the harness (it
# shells `python3`, which core is forbidden to do).
ecaa-workflow-harness = { version = "0.1", path = "../harness" }
clap = { workspace = true }
rustyline = "14"
colored = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `ecaa-workflow-audit-proof --secret <HEX>` decodes the 64-hex per-session
# HMAC secret into the 32-byte key for `AuditWriter::with_secret`. Pinned to
# match `crates/core` (the workspace doesn't promote `hex`).
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2.workspace = true
# `export` subcommand stages the depositable A+B tree in a scratch dir
# before zipping it into `--out`; the dir is removed when its guard drops.
tempfile.workspace = true
# v3 P7 — `migrate-sessions` subcommand reads/writes a `Version`
# directly when detecting the legacy `u32` shape.
semver = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `migrate_sessions` unit tests stage temp dirs.
tempfile.workspace = true
# `Command::cargo_bin("ecaa-workflow")` locator + `Assert` helpers for
# `tests/*_cli.rs` integration tests, so CLI subcommands have unit-level
# coverage rather than only Makefile / shell-script end-to-end paths.
assert_cmd = { workspace = true }
# Predicate combinators used by `Assert::stdout(predicate)`. Pinned
# inline because the workspace doesn't promote it (only assert_cmd
# consumers need it).
predicates = "3"
# `export_cli` re-opens the emitted `.zip` with `zip::ZipArchive` to
# assert its entry set (kept tiers present, dropped tiers absent).
zip.workspace = true

[lints]
workspace = true
